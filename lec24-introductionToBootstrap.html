<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec24 - Introduction to Bootstrap</title>
    <!-- 1. Bootstrap link ( CDN ) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- 2. Container -->
    <div class="container">

        <!-- 3. Utility Classes -->
        <h2 class="text-center text-primary">My First Bootstrap Website!</h2>
        <p class="text-center text-muted">Koi bhi CSS humne apply nahin ki hai!!</p>

        <p class="bg-dark text-white p-3 rounded shadow mb-4">
            bg-dark = background, text-white = color, p-3 = padding, mb-3 = margin
        </p>
    </div>

    <div class="container mt-5 text-center">

        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>

        <button class="btn btn-outline-primary">Primary</button>
        <button class="btn btn-outline-secondary">Secondary</button>
        <button class="btn btn-outline-success">Success</button>
        <button class="btn btn-outline-danger">Danger</button>
        <button class="btn btn-outline-warning">Warning</button>
    </div>

    
</body>

</html>
