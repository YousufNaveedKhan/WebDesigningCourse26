<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec04 - Box Model</title>
    <style>
        h2 {
            display: inline;
            /* padding: 20px; */
            margin-left: 20px;
            border-bottom: 2px solid blue;
        }
        p {
            border: 1px solid red;
        }

        b {
            border: 1px solid teal;
            padding: 12px;
            margin-right: 40px;
            border-radius: 26px;
        }
        i {
            border: 1px solid indigo;
        }
    </style>
</head>
<body>
    <h2>
        Hello World
    </h2>
    <b>Aptech</b>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam consequuntur ducimus recusandae aspernatur hic animi libero nam dignissimos repellendus, ullam amet vitae, illum velit veritatis error autem distinctio similique sapiente.
    </p>
    <b>Hello</b> <i>Hello</i>
    <button>See More</button>
</body>
</html>
